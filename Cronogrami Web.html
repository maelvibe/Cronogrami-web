<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cronogrami Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
<style>
:root {
  --bg: #111827;
  --surface: #1f2937;
  --surface2: #253347;
  --toolbar: #0f1a2d;
  --accent: #84cc16;
  --accent-dim: #4b7a0d;
  --fg: #e2e8f0;
  --fg2: #94a3b8;
  --fg3: #64748b;
  --border: #2d3f52;
  --border2: #1e2d3d;
  --row-even: #192434;
  --row-odd: #1c2840;
  --row-hover: #2a3d52;
  --row-selected: rgba(132,204,22,.12);
  --milestone: #f59e0b;
  --grid: rgba(255,255,255,.04);
  --today: rgba(239,68,68,.75);
  --danger: #ef4444;
  color-scheme: dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Inter',system-ui,sans-serif;font-size:13px}
body{background:var(--bg);color:var(--fg);display:flex;flex-direction:column}

/* ── TOOLBAR ─────────────────────────────────────────────── */
#toolbar{
  height:46px;background:var(--toolbar);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:4px;padding:0 10px;flex-shrink:0;
  user-select:none;
}
#logo{display:flex;align-items:center;gap:7px;margin-right:8px}
#logo svg{flex-shrink:0}
#logo-text{font-size:15px;font-weight:600;letter-spacing:-.3px;color:var(--fg)}
#logo-text span{color:var(--accent)}
#project-name{
  flex:1;font-size:12px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;max-width:240px;padding:2px 8px;border-radius:5px;
  cursor:text;border:1px solid transparent;outline:none;transition:border-color .15s,background .15s;
}
#project-name:hover{background:var(--surface2)}
#project-name:focus,[contenteditable="true"]#project-name{
  border-color:var(--accent);background:var(--surface2);color:var(--fg);
  white-space:normal;overflow:visible;text-overflow:clip;
}
.tb-sep{width:1px;height:22px;background:var(--border);margin:0 4px}
.tb-btn{
  display:flex;align-items:center;gap:5px;padding:5px 10px;border:none;
  background:transparent;color:var(--fg2);border-radius:6px;cursor:pointer;
  font-size:12px;font-family:inherit;white-space:nowrap;transition:background .12s,color .12s;
}
.tb-btn:hover{background:var(--surface2);color:var(--fg)}
.tb-btn.accent{background:var(--accent);color:#0d1a00;font-weight:600}
.tb-btn.accent:hover{background:#96da1a}
.tb-btn svg{flex-shrink:0}
.view-grp{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:7px;overflow:hidden}
.view-btn{
  padding:5px 11px;border:none;background:transparent;color:var(--fg2);cursor:pointer;
  font-size:12px;font-family:inherit;transition:background .12s,color .12s;
}
.view-btn:hover{background:var(--surface2);color:var(--fg)}
.view-btn.active{background:var(--accent);color:#0d1a00;font-weight:600}
#zoom-grp{display:flex;gap:2px}
.zoom-btn{
  width:26px;height:26px;border:1px solid var(--border);border-radius:5px;
  background:var(--surface);color:var(--fg2);cursor:pointer;font-size:15px;
  display:flex;align-items:center;justify-content:center;
  transition:background .12s;
}
.zoom-btn:hover{background:var(--surface2);color:var(--fg)}

/* ── MAIN BODY ───────────────────────────────────────────── */
#app-body{display:flex;flex:1;overflow:hidden;min-height:0}

/* ── LEFT PANEL ─────────────────────────────────────────── */
#left-panel{
  display:flex;flex-direction:column;flex-shrink:0;
  border-right:2px solid var(--border);min-width:0;
  background:var(--surface);
}
#col-header{
  display:flex;align-items:center;height:52px;
  background:var(--toolbar);border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.ch{
  font-size:11px;font-weight:500;color:var(--fg3);
  text-transform:uppercase;letter-spacing:.5px;
  padding:0 6px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.ch-num{width:36px;text-align:center}
.ch-name{flex:1;min-width:0}
.ch-start{width:74px}
.ch-days{width:42px;text-align:center}
.ch-end{width:74px}
.ch-resp{width:86px}
#task-scroll{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0}
#task-scroll::-webkit-scrollbar{width:6px}
#task-scroll::-webkit-scrollbar-track{background:transparent}
#task-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* Task rows */
.tr{
  display:flex;align-items:center;height:28px;cursor:pointer;
  border-bottom:1px solid var(--border2);
  transition:background .08s;
}
.tr:nth-child(even){background:var(--row-even)}
.tr:nth-child(odd){background:var(--row-odd)}
.tr:hover{background:var(--row-hover)}
.tr.selected{background:var(--row-selected)!important}
.tr-num{
  width:36px;text-align:center;font-size:11px;color:var(--fg3);
  font-variant-numeric:tabular-nums;flex-shrink:0;
}
.tr-name-wrap{
  flex:1;min-width:0;display:flex;align-items:center;gap:0;
  padding-right:4px;overflow:hidden;
}
.tr-indent{flex-shrink:0}
.tr-toggle{
  flex-shrink:0;width:16px;height:16px;display:flex;align-items:center;
  justify-content:center;cursor:pointer;color:var(--fg3);
  font-size:9px;transition:transform .15s;
}
.tr-toggle.open{transform:rotate(90deg)}
.tr-milestone-icon{font-size:10px;margin-right:3px;flex-shrink:0}
.tr-color-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-right:5px}
.tr-name{font-size:12px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-name.phase{font-weight:600;color:var(--fg)}
.tr-name.milestone{color:var(--milestone);font-weight:500}
.tr-date{
  font-size:11px;color:var(--fg3);font-variant-numeric:tabular-nums;
  flex-shrink:0;padding:0 4px;white-space:nowrap;overflow:hidden;
}
.tr-date.w74{width:74px}
.tr-date.w42{width:42px;text-align:center}
.tr-resp{
  width:86px;font-size:10px;color:var(--fg3);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;padding:0 6px;flex-shrink:0;
}
.tr-prog-bar{
  position:absolute;bottom:0;left:0;height:2px;background:var(--accent);
  border-radius:0 1px 1px 0;opacity:.7;pointer-events:none;
}

/* ── GANTT PANEL ─────────────────────────────────────────── */
#gantt-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#ruler-wrap{height:52px;overflow:hidden;flex-shrink:0;background:var(--toolbar);border-bottom:1px solid var(--border)}
#ruler-canvas{display:block}
#gantt-wrap{flex:1;overflow:auto;position:relative;min-height:0;cursor:default}
#gantt-wrap::-webkit-scrollbar{width:6px;height:6px}
#gantt-wrap::-webkit-scrollbar-track{background:transparent}
#gantt-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
#gantt-canvas{display:block}

/* ── TOOLTIP ─────────────────────────────────────────────── */
#tooltip{
  position:fixed;background:#1e2d3d;border:1px solid var(--border);
  border-radius:8px;padding:10px 12px;pointer-events:none;z-index:200;
  font-size:12px;max-width:240px;box-shadow:0 8px 24px rgba(0,0,0,.6);
  display:none;
}
#tooltip strong{color:var(--fg);display:block;margin-bottom:4px}
#tooltip .tt-row{color:var(--fg2);margin-bottom:2px}
#tooltip .tt-row span{color:var(--fg);margin-left:4px}
#tooltip .tt-prog{height:5px;background:var(--surface2);border-radius:3px;margin-top:6px;overflow:hidden}
#tooltip .tt-prog-fill{height:100%;border-radius:3px;background:var(--accent)}

/* ── DRAG RESIZE ─────────────────────────────────────────── */
#resize-handle{
  width:6px;background:transparent;cursor:col-resize;flex-shrink:0;
  transition:background .1s;z-index:10;
}
#resize-handle:hover,#resize-handle.dragging{background:var(--accent)}

/* ── EMPTY STATE ─────────────────────────────────────────── */
#empty-state{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;
  color:var(--fg3);pointer-events:none;
}
#empty-state svg{opacity:.3}
#empty-state p{font-size:14px;text-align:center;max-width:260px;line-height:1.5}
#empty-state p strong{color:var(--fg2)}

/* ── MODAL ───────────────────────────────────────────────── */
#modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.65);
  display:flex;align-items:center;justify-content:center;
  z-index:500;
}
#modal-overlay[hidden]{display:none!important}
#modal{
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;width:480px;max-width:calc(100vw - 24px);
  max-height:calc(100vh - 40px);display:flex;flex-direction:column;
  box-shadow:0 24px 64px rgba(0,0,0,.65);overflow:hidden;
}
#modal-header{
  display:flex;align-items:center;padding:14px 18px;
  border-bottom:1px solid var(--border);flex-shrink:0;
}
#modal-title{font-size:14px;font-weight:600;flex:1}
.modal-x{
  width:28px;height:28px;border:none;background:transparent;color:var(--fg3);
  cursor:pointer;border-radius:6px;font-size:15px;
  display:flex;align-items:center;justify-content:center;
  transition:background .1s,color .1s;
}
.modal-x:hover{background:var(--surface2);color:var(--fg)}
#modal-body{
  padding:16px 18px;overflow-y:auto;display:flex;
  flex-direction:column;gap:12px;min-height:0;
}
#modal-body::-webkit-scrollbar{width:5px}
#modal-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
#modal-footer-normal,#modal-footer-confirm{
  display:flex;align-items:center;gap:8px;
  padding:12px 18px;border-top:1px solid var(--border);flex-shrink:0;
}
#modal-footer-confirm[hidden],#modal-footer-normal[hidden]{display:none!important}
.modal-confirm-msg{font-size:12px;color:var(--fg2);flex:1;line-height:1.4}

/* Modal form elements */
.m-field{display:flex;flex-direction:column;gap:4px}
.m-label{font-size:11px;font-weight:500;color:var(--fg3);text-transform:uppercase;letter-spacing:.45px}
.m-input{
  background:var(--bg);border:1px solid var(--border);border-radius:6px;
  color:var(--fg);font-family:inherit;font-size:13px;padding:7px 10px;
  outline:none;transition:border-color .15s;color-scheme:dark;
  width:100%;
}
.m-input:focus{border-color:var(--accent)}
.m-input.error{border-color:var(--danger)}
.m-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m-checkbox-row{
  display:flex;align-items:center;gap:8px;cursor:pointer;
  font-size:13px;color:var(--fg2);user-select:none;
  padding:6px 0;
}
.m-checkbox-row input[type=checkbox]{
  width:15px;height:15px;accent-color:var(--accent);cursor:pointer;
  flex-shrink:0;
}
.m-range-row{display:flex;align-items:center;gap:10px}
.m-range-row input[type=range]{flex:1;accent-color:var(--accent);cursor:pointer}
.m-range-val{
  font-size:12px;color:var(--fg2);min-width:36px;text-align:right;
  font-variant-numeric:tabular-nums;font-weight:500;
}
#color-swatches{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.color-swatch{
  width:22px;height:22px;border-radius:50%;border:2px solid transparent;
  cursor:pointer;transition:transform .1s,border-color .1s;flex-shrink:0;
  padding:0;
}
.color-swatch:hover{transform:scale(1.2)}
.color-swatch.active{border-color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.4);transform:scale(1.1)}
.m-parent-info{
  font-size:11px;color:var(--fg3);background:var(--bg);
  border-radius:5px;padding:5px 9px;border:1px solid var(--border2);
}
.m-parent-info strong{color:var(--fg2)}

/* Shared buttons */
.btn-primary{
  background:var(--accent);color:#0d1a00;border:none;border-radius:7px;
  padding:7px 16px;font-size:13px;font-weight:600;cursor:pointer;
  font-family:inherit;transition:background .12s;
}
.btn-primary:hover{background:#96da1a}
.btn-ghost{
  background:transparent;color:var(--fg2);border:1px solid var(--border);
  border-radius:7px;padding:7px 14px;font-size:13px;cursor:pointer;
  font-family:inherit;transition:background .12s,color .12s;
}
.btn-ghost:hover{background:var(--surface2);color:var(--fg)}
.btn-danger{
  background:rgba(239,68,68,.12);color:var(--danger);
  border:1px solid rgba(239,68,68,.25);border-radius:7px;
  padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit;
  transition:background .12s,border-color .12s;
}
.btn-danger:hover{background:rgba(239,68,68,.22);border-color:rgba(239,68,68,.45)}
</style>

<!-- ── TOOLBAR ───────────────────────────────────────────── -->
<div id="toolbar">
  <div id="logo">
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
      <rect width="26" height="26" rx="6" fill="#84cc16"/>

    <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M2 4a1 1 0 011-1h3.586a1 1 0 01.707.293l.707.707A1 1 0 008.707 4H13a1 1 0 011 1v7a1 1 0 01-1 1H3a1 1 0 01-1-1V4z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>

</div>

<!-- ── APP BODY ──────────────────────────────────────────── -->
<div id="app-body">
  <div id="left-panel" style="width:420px">
    <div id="col-header">
      <div class="ch ch-num">#</div>
      <div class="ch ch-name">Nombre</div>
      <div class="ch ch-start">Inicio</div>

      <div id="empty-state">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none"><rect x="8" y="12" width="48" height="40" rx="4" stroke="#84cc16" stroke-width="2"/><path d="M20 24h24M20 32h16M20 40h20" stroke="#84cc16" stroke-width="2" stroke-linecap="round"/></svg>

</div>

<div id="tooltip"></div>
<input type="file" id="file-input" accept=".cronogrami,.json" onchange="handleFileOpen(event)">

<!-- ── MODAL ─────────────────────────────────────────────── -->
<div id="modal-overlay" hidden>
  <div id="modal">
    <div id="modal-header">
      <span id="modal-title">Editar tarea</span>
      <button class="modal-x" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body">
      <div class="m-field">
        <div class="m-label">Nombre</div>
        <input type="text" id="m-name" class="m-input" autocomplete="off" placeholder="Nombre de la tarea">
      </div>
      <label class="m-checkbox-row">
        <input type="checkbox" id="m-milestone">
        <span>Es hito (milestone) — punto de control sin duración</span>
      </label>
      <div class="m-2col" id="m-dates-row">
        <div class="m-field">
          <div class="m-label">Inicio</div>
          <input type="date" id="m-start" class="m-input">
        </div>
        <div class="m-field" id="m-end-field">
          <div class="m-label">Fin</div>
          <input type="date" id="m-end" class="m-input">
        </div>
      </div>
      <div class="m-field" id="m-duration-field">
        <div class="m-label">Duración (días)</div>
        <input type="number" id="m-duration" class="m-input" min="0" max="3650" style="width:120px">
      </div>
      <div class="m-field" id="m-progress-field">
        <div class="m-label">Avance</div>
        <div class="m-range-row">
          <input type="range" id="m-progress" min="0" max="100" value="0">
          <span class="m-range-val" id="m-progress-val">0%</span>
        </div>
      </div>
      <div class="m-field">
        <div class="m-label">Responsable</div>
        <input type="text" id="m-resp" class="m-input" autocomplete="off" placeholder="Nombre del responsable">
      </div>
      <div class="m-field">
        <div class="m-label">Color</div>
        <div id="color-swatches"></div>
      </div>
      <div id="m-parent-info" class="m-parent-info" hidden></div>
    </div>
    <div id="modal-footer-normal">
      <button id="modal-delete-btn" class="btn-danger" onclick="showDeleteConfirm()">Eliminar</button>
      <div style="flex:1"></div>
      <button class="btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary" onclick="saveModal()">Guardar</button>
    </div>
    <div id="modal-footer-confirm" hidden>
      <span class="modal-confirm-msg" id="modal-delete-msg">¿Eliminar esta tarea?</span>
      <button class="btn-ghost" onclick="hideDeleteConfirm()">No</button>
      <button class="btn-danger" onclick="confirmDeleteModal()">Sí, eliminar</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
let state = {
  project: null,
  flat: [],
  view: 'week',
  pxPerDay: 22,
  scrollX: 0,
  scrollY: 0,
  selectedId: null,
  expanded: new Set(),
  chartStart: null,
  chartEnd: null,
};

const VIEW_PX = { day: 28, week: 22, month: 8 };
const ROW_H = 28;
const HEADER_H = 52;

// ═══════════════════════════════════════════════════════════
// DEMO PROJECT
// ═══════════════════════════════════════════════════════════
const DEMO = {

    {id:"t1",taskNum:2,name:"Definición de Requerimientos",startDate:"2026-01-05",endDate:"2026-01-23",duration:15,progress:100,responsible:"Ana García",color:"#3b82f6",parentId:"p1",dependencies:[],isMilestone:false},

// ═══════════════════════════════════════════════════════════
// DATE HELPERS
// ═══════════════════════════════════════════════════════════
function parseDate(s) {
  if (!s) return null;
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}
function fmtDate(d) {
  if (!d) return '';
  const y = d.getFullYear(), mo = String(d.getMonth()+1).padStart(2,'0'), dd = String(d.getDate()).padStart(2,'0');
  return `${y}-${mo}-${dd}`;
}
function fmtShort(d) {
  if (!d) return '';
  const mo = String(d.getMonth()+1).padStart(2,'0'), dd = String(d.getDate()).padStart(2,'0');
  return `${dd}/${mo}`;
}
function addDays(d, n) {
  const r = new Date(d); r.setDate(r.getDate() + n); return r;
}
function diffDays(a, b) {
  return Math.round((b - a) / 86400000);
}
const MONTHS_ES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const MONTHS_FULL = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

// ═══════════════════════════════════════════════════════════
// TASK HELPERS
// ═══════════════════════════════════════════════════════════
function getTaskById(id) {
  return (state.project?.tasks || []).find(t => t.id === id) || null;
}

function getAllDescendants(taskId) {
  const result = [];
  function walk(id) {
    (state.project.tasks || []).filter(t => t.parentId === id).forEach(c => {
      result.push(c.id);
      walk(c.id);
    });
  }
  walk(taskId);
  return result;
}

function renumberTasks() {
  if (!state.project) return;
  const tasks = state.project.tasks;
  const byId = {};
  tasks.forEach(t => byId[t.id] = t);
  const children = {};
  const roots = [];
  tasks.forEach(t => {
    const pid = t.parentId && byId[t.parentId] ? t.parentId : null;
    if (pid) { if (!children[pid]) children[pid] = []; children[pid].push(t); }
    else roots.push(t);
  });
  let num = 1;
  function walk(task) { task.taskNum = num++; (children[task.id]||[]).forEach(walk); }
  roots.forEach(walk);
}

function ensureProject() {
  if (!state.project) {
    state.project = { version:'1.0', project_name:'Nuevo proyecto', tasks:[], holidays:[], incidents:[] };
    document.getElementById('project-name').textContent = 'Nuevo proyecto';
    document.getElementById('empty-state').style.display = 'none';
  }
}

// ═══════════════════════════════════════════════════════════
// BUILD FLAT DISPLAY LIST
// ═══════════════════════════════════════════════════════════
function buildFlat() {
  if (!state.project) return [];
  const tasks = state.project.tasks || [];
  const byId = {};
  tasks.forEach(t => byId[t.id] = t);
  const children = {};
  const roots = [];
  tasks.forEach(t => {
    if (t.parentId && byId[t.parentId]) {
      if (!children[t.parentId]) children[t.parentId] = [];
      children[t.parentId].push(t);
    } else roots.push(t);
  });
  const flat = [];
  function walk(task, depth) {
    const hasKids = (children[task.id]||[]).length > 0;
    flat.push({ task, depth, hasKids });
    if (hasKids && state.expanded.has(task.id)) {
      for (const child of children[task.id]) walk(child, depth+1);
    }
  }
  roots.forEach(r => walk(r, 0));
  return flat;
}

// ═══════════════════════════════════════════════════════════
// CHART DATE RANGE
// ═══════════════════════════════════════════════════════════
function calcRange() {
  if (!state.project) return;
  const tasks = state.project.tasks || [];
  let min = null, max = null;
  tasks.forEach(t => {
    const s = parseDate(t.startDate), e = parseDate(t.endDate);
    if (s && (!min || s < min)) min = s;
    if (e && (!max || e > max)) max = e;
  });
  if (!min) min = new Date();
  if (!max) max = addDays(min, 30);
  state.chartStart = addDays(min, -7);
  state.chartEnd   = addDays(max, 14);
}

function dateToX(d) { return diffDays(state.chartStart, d) * state.pxPerDay; }
function chartWidth() {
  if (!state.chartStart || !state.chartEnd) return 2000;
  return diffDays(state.chartStart, state.chartEnd) * state.pxPerDay;
}

// RENDER LEFT PANEL
// ═══════════════════════════════════════════════════════════
function renderLeft() {
  const scroll = document.getElementById('task-scroll');
  const rows = state.flat;
  if (!rows.length) { scroll.innerHTML = ''; return; }
  let html = '';
  rows.forEach(({task, depth, hasKids}) => {
    const sel = task.id === state.selectedId ? ' selected' : '';
    const nameClass = task.parentId == null ? ' phase' : (task.isMilestone ? ' milestone' : '');
    const indent = depth * 14;
    const isOpen = state.expanded.has(task.id);
    const s = fmtShort(parseDate(task.startDate));
    const e = fmtShort(parseDate(task.endDate));
    const dur = task.isMilestone ? '—' : (task.duration || '');
    const resp = (task.responsible || '').split(' ').slice(0,2).join(' ');
    const toggleHtml = hasKids
      ? `<div class="tr-toggle${isOpen?' open':''}" data-id="${task.id}">▶</div>`
      : `<div style="width:16px;flex-shrink:0"></div>`;
    const dotColor = task.color || '#64748b';
    const msIcon = task.isMilestone ? `<span class="tr-milestone-icon">◆</span>` : '';
    html += `<div class="tr${sel}" data-id="${task.id}" style="position:relative">
      <div class="tr-num">${task.taskNum}</div>
      <div class="tr-name-wrap">
        <div class="tr-indent" style="width:${indent}px"></div>
        ${toggleHtml}${msIcon}
        ${!task.isMilestone?`<div class="tr-color-dot" style="background:${dotColor}"></div>`:''}
        <div class="tr-name${nameClass}">${esc(task.name)}</div>
      </div>
      <div class="tr-date w74">${s}</div>
      <div class="tr-date w42">${dur}</div>
      <div class="tr-date w74">${e}</div>
      <div class="tr-resp">${esc(resp)}</div>
      ${!task.isMilestone && task.progress > 0 ? `<div class="tr-prog-bar" style="width:${task.progress}%"></div>` : ''}
    </div>`;
  });
  scroll.innerHTML = html;
}

function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ═══════════════════════════════════════════════════════════
// RENDER RULER CANVAS
// ═══════════════════════════════════════════════════════════
function renderRuler() {
  const canvas = document.getElementById('ruler-canvas');
  const w = chartWidth();
  canvas.width  = w; canvas.height = HEADER_H;
  canvas.style.width = w + 'px';
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, w, HEADER_H);
  ctx.fillStyle = '#0f1a2d';
  ctx.fillRect(0, 0, w, HEADER_H);
  if (state.view === 'day') {
    drawMonthLabels(ctx, w, 0, 26); drawDayLabels(ctx, w, 26, 26);
  } else if (state.view === 'week') {
    drawMonthLabels(ctx, w, 0, 26); drawWeekLabels(ctx, w, 26, 26);
  } else {
    drawYearLabels(ctx, w, 0, 22); drawMonthFull(ctx, w, 22, 30);
  }
  const tx = dateToX(new Date());
  if (tx >= 0 && tx <= w) {
    ctx.fillStyle = 'rgba(239,68,68,.85)';
    ctx.fillRect(tx-1, 0, 2, HEADER_H);
    ctx.fillStyle = '#ef4444';
    ctx.beginPath(); ctx.arc(tx, HEADER_H-4, 4, 0, Math.PI*2); ctx.fill();
  }
}

function drawMonthLabels(ctx, w, y, h) {
  ctx.font = '500 11px Inter,system-ui'; ctx.textBaseline = 'middle';
  let cur = new Date(state.chartStart); cur.setDate(1);
  if (cur < state.chartStart) cur.setMonth(cur.getMonth()+1);
  ctx.strokeStyle = '#2d3f52'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, y+h-0.5); ctx.lineTo(w, y+h-0.5); ctx.stroke();
  while (cur <= state.chartEnd) {
    const x = dateToX(cur);
    const nextMonth = new Date(cur.getFullYear(), cur.getMonth()+1, 1);
    const x2 = Math.min(dateToX(nextMonth), w);
    const label = MONTHS_ES[cur.getMonth()] + ' ' + cur.getFullYear();
    ctx.fillStyle = '#2d3f52'; ctx.fillRect(x, y, 1, h);
    ctx.fillStyle = '#94a3b8'; ctx.textAlign = 'center';
    ctx.fillText(label, x+(x2-x)/2, y+h/2);
    cur = nextMonth;
  }
}

function drawDayLabels(ctx, w, y, h) {
  ctx.font = '400 10px Inter,system-ui'; ctx.textBaseline = 'middle';
  const days = diffDays(state.chartStart, state.chartEnd);
  for (let i = 0; i <= days; i++) {
    const d = addDays(state.chartStart, i);
    const x = i * state.pxPerDay;
    const dow = d.getDay();
    const isWeekend = dow===0||dow===6;
    if (isWeekend) { ctx.fillStyle='rgba(0,0,0,.2)'; ctx.fillRect(x, y, state.pxPerDay, h); }
    ctx.fillStyle = '#2d3f52'; ctx.fillRect(x, y, 1, h);
    if (state.pxPerDay >= 16) {
      ctx.fillStyle = isWeekend ? '#4b5563' : '#64748b';
      ctx.textAlign = 'center';
      ctx.fillText(d.getDate(), x+state.pxPerDay/2, y+h/2);
    }
  }
}

function drawWeekLabels(ctx, w, y, h) {
  ctx.font = '400 10px Inter,system-ui'; ctx.textBaseline = 'middle';
  let cur = new Date(state.chartStart);
  const startDow = cur.getDay();
  const daysBack = startDow===0 ? 6 : startDow-1;
  cur = addDays(cur, -daysBack);
  while (cur <= state.chartEnd) {
    const x = dateToX(cur);
    if (x >= 0) {
      ctx.fillStyle = '#2d3f52'; ctx.fillRect(x, y, 1, h);
      ctx.fillStyle = '#64748b'; ctx.textAlign = 'left';
      ctx.fillText(fmtShort(cur), x+3, y+h/2);
    }
    cur = addDays(cur, 7);
  }
}

function drawYearLabels(ctx, w, y, h) {
  ctx.font = '500 11px Inter,system-ui'; ctx.textBaseline = 'middle';
  let cur = new Date(state.chartStart.getFullYear(), 0, 1);
  while (cur <= state.chartEnd) {
    const x = dateToX(cur);
    const nextY = new Date(cur.getFullYear()+1, 0, 1);
    const x2 = Math.min(dateToX(nextY), w);
    ctx.fillStyle = '#94a3b8'; ctx.textAlign = 'center';
    ctx.fillText(cur.getFullYear(), x+(x2-x)/2, y+h/2);
    cur = nextY;
  }
}

function drawMonthFull(ctx, w, y, h) {
  ctx.font = '400 11px Inter,system-ui'; ctx.textBaseline = 'middle';
  let cur = new Date(state.chartStart); cur.setDate(1);
  ctx.strokeStyle = '#2d3f52'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, y+h-0.5); ctx.lineTo(w, y+h-0.5); ctx.stroke();
  while (cur <= state.chartEnd) {
    const x = dateToX(cur);
    const nextMonth = new Date(cur.getFullYear(), cur.getMonth()+1, 1);
    const x2 = Math.min(dateToX(nextMonth), w);
    const label = MONTHS_ES[cur.getMonth()];
    ctx.fillStyle = '#2d3f52'; ctx.fillRect(x, y, 1, h);
    if (x2-x > 20) { ctx.fillStyle='#94a3b8'; ctx.textAlign='center'; ctx.fillText(label, x+(x2-x)/2, y+h/2); }
    cur = nextMonth;
  }
}

// ═══════════════════════════════════════════════════════════
// RENDER GANTT CANVAS
// ═══════════════════════════════════════════════════════════
function renderGantt() {
  const canvas = document.getElementById('gantt-canvas');
  const wrap   = document.getElementById('gantt-wrap');
  const cw = chartWidth();
  const ch = Math.max(state.flat.length * ROW_H, wrap.clientHeight || 400);
  canvas.width = cw; canvas.height = ch;
  canvas.style.width = cw+'px'; canvas.style.height = ch+'px';
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, cw, ch);
  ctx.fillStyle = '#111827'; ctx.fillRect(0, 0, cw, ch);
  const pxd = state.pxPerDay;
  const today = new Date();

  // Weekend columns
  const days = diffDays(state.chartStart, state.chartEnd);
  for (let i = 0; i <= days; i++) {
    const d = addDays(state.chartStart, i);
    if (d.getDay()===0||d.getDay()===6) {
      ctx.fillStyle='rgba(0,0,0,.18)'; ctx.fillRect(i*pxd, 0, pxd, ch);
    }
  }

  // Vertical grid lines
  ctx.strokeStyle = 'rgba(255,255,255,.04)'; ctx.lineWidth = 1;
  if (state.view==='day') {
    for (let i=0;i<=days;i++) { const x=i*pxd+.5; ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,ch);ctx.stroke(); }
  } else if (state.view==='week') {
    let cur = new Date(state.chartStart);
    while (cur.getDay()!==1) cur=addDays(cur,1);
    while (cur<=state.chartEnd) {
      const x=dateToX(cur)+.5; ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,ch);ctx.stroke(); cur=addDays(cur,7);
    }
  } else {
    let cur = new Date(state.chartStart); cur.setDate(1);
    while (cur<=state.chartEnd) {
      const x=dateToX(cur)+.5; ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,ch);ctx.stroke();
      cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
    }
  }

  // Horizontal row lines
  ctx.strokeStyle='rgba(255,255,255,.03)'; ctx.lineWidth=1;
  state.flat.forEach((_,i) => { const y=i*ROW_H+ROW_H-.5; ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cw,y);ctx.stroke(); });

  // Row alternating fill
  state.flat.forEach(({task},i) => {
    if (i%2===0) { ctx.fillStyle='rgba(25,36,52,.6)'; ctx.fillRect(0,i*ROW_H,cw,ROW_H); }
  });

  // Today dashed line (behind bars)
  const tx = dateToX(today);
  if (tx>=0&&tx<=cw) {
    ctx.strokeStyle='rgba(239,68,68,.3)'; ctx.lineWidth=1; ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(tx+.5,0);ctx.lineTo(tx+.5,ch);ctx.stroke();
    ctx.setLineDash([]);
  }

  // Dependency arrows
  const taskById = {};
  state.flat.forEach(({task},i) => { taskById[task.id]={task,row:i}; });
  state.flat.forEach(({task},i) => {
    (task.dependencies||[]).forEach(depId => {
      const dep = taskById[depId]; if (!dep) return;
      const x1 = dateToX(parseDate(dep.task.endDate))+pxd;
      const y1 = dep.row*ROW_H+ROW_H/2;
      const x2 = dateToX(parseDate(task.startDate));
      const y2 = i*ROW_H+ROW_H/2;
      ctx.strokeStyle='rgba(100,116,139,.5)'; ctx.lineWidth=1; ctx.setLineDash([3,3]);
      ctx.beginPath(); ctx.moveTo(x1,y1);
      if (x2>x1+10) { ctx.lineTo(x2,y1); ctx.lineTo(x2,y2); }
      else {
        const mid=Math.max(x1+6,x2+6);
        ctx.lineTo(mid,y1);ctx.lineTo(mid,(y1+y2)/2);
        ctx.lineTo(x2-4,(y1+y2)/2);ctx.lineTo(x2-4,y2);ctx.lineTo(x2,y2);
      }
      ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle='rgba(100,116,139,.5)';
      ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-6,y2-4);ctx.lineTo(x2-6,y2+4);ctx.closePath();ctx.fill();
    });
  });

  // Task bars
  state.flat.forEach(({task,depth},i) => {
    const s=parseDate(task.startDate), e=parseDate(task.endDate);
    if (!s||!e) return;
    const x=dateToX(s);
    const barW=Math.max(dateToX(e)-x+pxd, 4);
    const rowTop=i*ROW_H;
    const isSelected=task.id===state.selectedId;
    const color=task.color||'#3b82f6';
    const isPhase=!task.parentId;

    if (task.isMilestone) {
      const cx=dateToX(s)+pxd/2, cy=rowTop+ROW_H/2, sz=9;
      ctx.fillStyle=color;
      ctx.beginPath();ctx.moveTo(cx,cy-sz);ctx.lineTo(cx+sz,cy);ctx.lineTo(cx,cy+sz);ctx.lineTo(cx-sz,cy);ctx.closePath();ctx.fill();
      if (isSelected) { ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke(); }
    } else {
      const barH=isPhase?14:16;
      const barY=rowTop+(ROW_H-barH)/2;
      const r=3;
      if (isSelected) { ctx.shadowColor=color; ctx.shadowBlur=8; }
      ctx.fillStyle=isPhase?hexWithAlpha(color,.35):hexWithAlpha(color,.85);
      roundRect(ctx,x,barY,barW,barH,r); ctx.fill();
      ctx.shadowBlur=0;
      if (isPhase) { ctx.fillStyle=color; roundRect(ctx,x,barY,barW,3,{tl:3,tr:3,bl:0,br:0}); ctx.fill(); }
      if (!isPhase&&task.progress>0) {
        const pw=Math.max(barW*task.progress/100,4);
        ctx.fillStyle=hexWithAlpha(color,.5);
        roundRect(ctx,x,barY+barH-4,pw,4,{tl:0,tr:0,bl:r,br:r}); ctx.fill();
      }
      if (isSelected) { ctx.strokeStyle='#fff';ctx.lineWidth=1.5; roundRect(ctx,x,barY,barW,barH,r); ctx.stroke(); }
      if (barW>30&&state.pxPerDay>=4) {
        ctx.fillStyle=isPhase?color:'#e2e8f0';
        ctx.font=isPhase?'600 11px Inter,system-ui':'400 11px Inter,system-ui';
        ctx.textBaseline='middle'; ctx.textAlign='left';
        const label=task.name+(task.progress>0?` (${task.progress}%)`:'');
        const maxW=barW-10;
        ctx.save(); ctx.beginPath(); ctx.rect(x,barY,barW,barH); ctx.clip();
        ctx.fillText(label,x+6,rowTop+ROW_H/2);
        ctx.restore();
      }
    }
  });

  // Today line on top
  if (tx>=0&&tx<=cw) {
    ctx.strokeStyle='rgba(239,68,68,.9)'; ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(tx+.5,0);ctx.lineTo(tx+.5,ch);ctx.stroke();
  }
}

// ─── Canvas helpers ──────────────────────────────────────
function hexWithAlpha(hex, a) {
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function roundRect(ctx, x, y, w, h, r) {
  if (typeof r==='number') r={tl:r,tr:r,bl:r,br:r};
  ctx.beginPath();
  ctx.moveTo(x+r.tl,y); ctx.lineTo(x+w-r.tr,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r.tr);
  ctx.lineTo(x+w,y+h-r.br); ctx.quadraticCurveTo(x+w,y+h,x+w-r.br,y+h);
  ctx.lineTo(x+r.bl,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r.bl);
  ctx.lineTo(x,y+r.tl); ctx.quadraticCurveTo(x,y,x+r.tl,y); ctx.closePath();
}

let syncingScroll = false;
function setupScrollSync() {
  const taskScroll=document.getElementById('task-scroll');
  const ganttWrap=document.getElementById('gantt-wrap');
  const rulerWrap=document.getElementById('ruler-wrap');

// ═══════════════════════════════════════════════════════════
// CANVAS INTERACTION: tooltip + click + drag/resize
// ═══════════════════════════════════════════════════════════
function setupCanvasInteraction() {
  const canvas = document.getElementById('gantt-canvas');
  const tt = document.getElementById('tooltip');
  let drag = null;
  // drag: { zone:'bar'|'resize', task, taskId, startClientX, origStart, origEnd, hasMoved }

  function getHit(mx, my) {
    const row = Math.floor(my / ROW_H);
    if (row < 0 || row >= state.flat.length) return null;
    const { task } = state.flat[row];
    const s = parseDate(task.startDate), e = parseDate(task.endDate);
    if (!s || !e) return null;
    const pxd = state.pxPerDay;

    if (task.isMilestone) {
      const cx = dateToX(s)+pxd/2, cy = row*ROW_H+ROW_H/2, sz = 12;
      if (Math.abs(mx-cx)+Math.abs(my-cy) <= sz*1.3)
        return { task, row, zone:'milestone' };
      return null;
    }

    const barH = !task.parentId ? 14 : 16;
    const barY = row*ROW_H + (ROW_H-barH)/2;
    const barX = dateToX(s);
    const barW = Math.max(dateToX(e)-barX+pxd, 4);

    // Hit zone: slightly generous (4px outside)
    if (mx >= barX-2 && mx <= barX+barW+2 && my >= barY-2 && my <= barY+barH+2) {
      const zone = mx >= barX+barW-8 ? 'resize' : 'bar';
      return { task, row, zone, barX, barW };
    }
    return null;
  }

  function showTooltip(e, task) {
    const s = parseDate(task.startDate), en = parseDate(task.endDate);
    tt.innerHTML = `
      <strong>${esc(task.name)}</strong>
      <div class="tt-row">Inicio: <span>${fmtDate(s)}</span></div>
      <div class="tt-row">Fin: <span>${fmtDate(en)}</span></div>
      ${!task.isMilestone?`<div class="tt-row">Duración: <span>${task.duration||diffDays(s,en)} días</span></div>`:''}
      ${task.responsible?`<div class="tt-row">Resp.: <span>${esc(task.responsible)}</span></div>`:''}
      ${!task.isMilestone?`<div class="tt-prog"><div class="tt-prog-fill" style="width:${task.progress}%;background:${task.color||'#84cc16'}"></div></div>
      <div class="tt-row" style="text-align:right;margin-top:2px"><span>${task.progress}% completado</span></div>`:''}
    `;
    tt.style.display = 'block';
    const ttW=230, ttH=tt.offsetHeight;
    let lx=e.clientX+16, ly=e.clientY-10;
    if (lx+ttW>window.innerWidth-10) lx=e.clientX-ttW-16;
    if (ly+ttH>window.innerHeight-10) ly=window.innerHeight-ttH-10;
    tt.style.left=lx+'px'; tt.style.top=ly+'px';
  }

  canvas.addEventListener('mousemove', e => {
    if (drag) return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const hit = getHit(mx, my);

    if (!hit) { tt.style.display='none'; canvas.style.cursor='default'; return; }
    if (hit.zone==='resize') canvas.style.cursor='e-resize';
    else if (hit.zone==='bar') canvas.style.cursor='grab';
    else canvas.style.cursor='default';
    showTooltip(e, hit.task);
  });

  canvas.addEventListener('mouseleave', () => {
    if (!drag) tt.style.display='none';
  });

  canvas.addEventListener('mousedown', e => {
    if (e.button!==0) return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const hit = getHit(mx, my);
    if (!hit) return;

    drag = {
      zone: hit.zone,
      task: hit.task,
      taskId: hit.task.id,
      startClientX: e.clientX,
      origStart: parseDate(hit.task.startDate),
      origEnd: parseDate(hit.task.endDate),
      hasMoved: false,
    };
    tt.style.display = 'none';

    if (hit.zone==='bar'||hit.zone==='resize') {
      document.body.style.userSelect = 'none';
      document.body.style.cursor = hit.zone==='resize' ? 'e-resize' : 'grabbing';
      e.preventDefault();
    }
  });

  canvas.addEventListener('dblclick', e => {
    if (drag) return;
    const rect = canvas.getBoundingClientRect();
    const my = e.clientY - rect.top;
    const row = Math.floor(my / ROW_H);
    const item = state.flat[row];
    if (!item) return;
    state.selectedId = item.task.id;
    openModal(item.task.id);
  });

  document.addEventListener('mousemove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.startClientX;
    if (Math.abs(dx) > 3) drag.hasMoved = true;
    if (!drag.hasMoved) return;

    const dDays = Math.round(dx / state.pxPerDay);
    const task = drag.task;

    if (drag.zone==='bar') {
      task.startDate = fmtDate(addDays(drag.origStart, dDays));
      task.endDate   = fmtDate(addDays(drag.origEnd,   dDays));
    } else if (drag.zone==='resize') {
      const newEnd = addDays(drag.origEnd, dDays);
      if (newEnd >= drag.origStart) {
        task.endDate = fmtDate(newEnd);
        task.duration = Math.max(0, diffDays(drag.origStart, newEnd));
      }
    }
    calcRange(); renderRuler(); renderGantt();
  });

  document.addEventListener('mouseup', e => {
    if (!drag) return;
    const wasDrag = drag.hasMoved;
    const taskId = drag.taskId;

    drag = null;
    document.body.style.userSelect = '';
    document.body.style.cursor = '';
    document.getElementById('gantt-canvas').style.cursor = 'default';

    if (!wasDrag) {
      state.selectedId = taskId;
      renderLeft(); renderGantt();
    } else {
      rebuildAndRender();
    }
  });
}

// ═══════════════════════════════════════════════════════════
// ROW INTERACTIONS (expand/collapse, select, dblclick)
// ═══════════════════════════════════════════════════════════
function setupRowEvents() {
  const scroll = document.getElementById('task-scroll');

  scroll.addEventListener('click', e => {
    const toggle = e.target.closest('.tr-toggle');
    if (toggle) {
      const id = toggle.dataset.id;
      if (state.expanded.has(id)) state.expanded.delete(id);
      else state.expanded.add(id);
      e.stopPropagation();
      rebuildAndRender();
      return;
    }
    const row = e.target.closest('.tr');
    if (row) {
      state.selectedId = row.dataset.id;
      const idx = state.flat.findIndex(f => f.task.id === state.selectedId);
      if (idx >= 0) {
        const task = state.flat[idx].task;
        const ganttWrap = document.getElementById('gantt-wrap');
        const sx = dateToX(parseDate(task.startDate)) - 60;
        ganttWrap.scrollLeft = Math.max(0, sx);
      }
      renderLeft(); renderGantt();
    }
  });

  scroll.addEventListener('dblclick', e => {
    const row = e.target.closest('.tr');
    if (row && !e.target.closest('.tr-toggle')) {
      state.selectedId = row.dataset.id;
      openModal(row.dataset.id);
      e.stopPropagation();
    }
  });
}

// ═══════════════════════════════════════════════════════════
// RESIZE HANDLE
// ═══════════════════════════════════════════════════════════
function setupResize() {
  const handle = document.getElementById('resize-handle');
  const panel  = document.getElementById('left-panel');
  let dragging = false, startX = 0, startW = 0;
  handle.addEventListener('mousedown', e => {
    dragging=true; startX=e.clientX; startW=panel.offsetWidth;
    handle.classList.add('dragging');
    document.body.style.userSelect='none'; document.body.style.cursor='col-resize';
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const newW = Math.max(260, Math.min(700, startW+e.clientX-startX));
    panel.style.width = newW+'px';
  });
  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging=false; handle.classList.remove('dragging');
    document.body.style.userSelect=''; document.body.style.cursor='';
    renderRuler(); renderGantt();
  });
}

// ═══════════════════════════════════════════════════════════
// MODAL
// ═══════════════════════════════════════════════════════════
const COLORS = [
  '#3b82f6','#22c55e','#8b5cf6','#ef4444',
  '#f97316','#eab308','#14b8a6','#ec4899',
  '#84cc16','#f59e0b','#6366f1','#06b6d4',
];
let modalEditId = null;
let modalColor = '#3b82f6';

function initColorSwatches() {
  const container = document.getElementById('color-swatches');
  COLORS.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'color-swatch';
    btn.dataset.color = c;
    btn.style.background = c;
    btn.title = c;
    btn.onclick = () => selectModalColor(c);
    container.appendChild(btn);
  });
}

function selectModalColor(hex) {
  modalColor = hex;
  document.querySelectorAll('.color-swatch').forEach(s => {
    s.classList.toggle('active', s.dataset.color === hex);
  });
}

function updateMilestoneFields(isMilestone) {
  document.getElementById('m-end-field').style.display      = isMilestone ? 'none' : '';
  document.getElementById('m-duration-field').style.display = isMilestone ? 'none' : '';
  document.getElementById('m-progress-field').style.display = isMilestone ? 'none' : '';
}

function openModal(taskId) {
  modalEditId = taskId || null;
  hideDeleteConfirm();

  let task;
  if (!modalEditId) {
    // New task — determine parent context
    let parentId = null;
    if (state.selectedId) {
      const sel = getTaskById(state.selectedId);
      if (sel) parentId = sel.parentId ? sel.parentId : sel.id;
    }
    const today = fmtDate(new Date());
    const nextWeek = fmtDate(addDays(new Date(), 7));
    const parentTask = parentId ? getTaskById(parentId) : null;
    task = { name:'', startDate:today, endDate:nextWeek, duration:7, progress:0, responsible:'', color: parentTask?.color||'#3b82f6', isMilestone:false, parentId };
  } else {
    task = getTaskById(modalEditId);
    if (!task) return;
  }

  document.getElementById('modal-title').textContent = modalEditId ? 'Editar tarea' : 'Nueva tarea';
  document.getElementById('m-name').value = task.name || '';
  document.getElementById('m-name').style.borderColor = '';
  document.getElementById('m-start').value = task.startDate || '';
  document.getElementById('m-end').value = task.endDate || '';
  document.getElementById('m-duration').value = task.duration != null ? task.duration : diffDays(parseDate(task.startDate)||new Date(), parseDate(task.endDate)||new Date());
  document.getElementById('m-progress').value = task.progress || 0;
  document.getElementById('m-progress-val').textContent = (task.progress||0) + '%';
  document.getElementById('m-resp').value = task.responsible || '';
  document.getElementById('m-milestone').checked = !!task.isMilestone;

  selectModalColor(task.color || '#3b82f6');
  updateMilestoneFields(!!task.isMilestone);

  // Parent info
  const parentInfo = document.getElementById('m-parent-info');
  if (!modalEditId) {
    const parentName = task.parentId ? (getTaskById(task.parentId)?.name || '?') : null;
    parentInfo.hidden = false;
    parentInfo.innerHTML = parentName
      ? `Subtarea de: <strong>${esc(parentName)}</strong>`
      : `Tarea raíz (sin fase padre)`;
  } else {
    parentInfo.hidden = true;
  }

  document.getElementById('modal-delete-btn').hidden = !modalEditId;
  document.getElementById('modal-overlay').hidden = false;
  requestAnimationFrame(() => {
    document.getElementById('m-name').focus();
    document.getElementById('m-name').select();
  });
}

function closeModal() {
  document.getElementById('modal-overlay').hidden = true;
  modalEditId = null;
}

function saveModal() {
  const nameEl = document.getElementById('m-name');
  const name = nameEl.value.trim();
  if (!name) {
    nameEl.style.borderColor = 'var(--danger)';
    nameEl.focus();
    return;
  }
  nameEl.style.borderColor = '';

  ensureProject();
  const isMilestone = document.getElementById('m-milestone').checked;
  const startDate = document.getElementById('m-start').value;
  const endDate = isMilestone ? startDate : document.getElementById('m-end').value;
  const duration = isMilestone ? 0 : (parseInt(document.getElementById('m-duration').value) || 0);
  const progress = Math.max(0, Math.min(100, parseInt(document.getElementById('m-progress').value) || 0));
  const responsible = document.getElementById('m-resp').value.trim();

  if (modalEditId) {
    const task = getTaskById(modalEditId);
    if (!task) { closeModal(); return; }
    task.name = name; task.startDate = startDate; task.endDate = endDate;
    task.duration = duration; task.progress = progress;
    task.responsible = responsible; task.color = modalColor; task.isMilestone = isMilestone;
  } else {
    let parentId = null;
    if (state.selectedId) {
      const sel = getTaskById(state.selectedId);
      if (sel) parentId = sel.parentId ? sel.parentId : sel.id;
    }
    const newTask = {
      id: 'task_' + Date.now() + '_' + Math.random().toString(36).slice(2,5),
      taskNum: 0, name, startDate, endDate, duration, progress,
      responsible, color: modalColor, parentId, dependencies: [], isMilestone
    };
    state.project.tasks.push(newTask);
    state.selectedId = newTask.id;
    if (parentId) state.expanded.add(parentId);
  }

  renumberTasks();
  closeModal();
  rebuildAndRender();
}

function showDeleteConfirm() {
  const task = getTaskById(modalEditId);
  if (!task) return;
  const desc = getAllDescendants(modalEditId);
  document.getElementById('modal-delete-msg').textContent =
    desc.length > 0
      ? `¿Eliminar "${task.name}" y sus ${desc.length} subtarea(s)?`
      : `¿Eliminar "${task.name}"?`;
  document.getElementById('modal-footer-normal').hidden = true;
  document.getElementById('modal-footer-confirm').hidden = false;
}

function hideDeleteConfirm() {
  document.getElementById('modal-footer-normal').hidden = false;
  document.getElementById('modal-footer-confirm').hidden = true;
}

function confirmDeleteModal() {
  if (!modalEditId) return;
  const toDelete = [modalEditId, ...getAllDescendants(modalEditId)];
  toDelete.forEach(id => {
    state.project.tasks = state.project.tasks.filter(t => t.id !== id);
    state.project.tasks.forEach(t => {
      t.dependencies = (t.dependencies || []).filter(d => d !== id);
    });
    state.expanded.delete(id);
  });
  if (toDelete.includes(state.selectedId)) state.selectedId = null;
  renumberTasks();
  closeModal();
  rebuildAndRender();
}

function setupModal() {
  // Date ↔ duration sync
  document.getElementById('m-start').addEventListener('change', syncDurationFromDates);
  document.getElementById('m-end').addEventListener('change', syncDurationFromDates);
  document.getElementById('m-duration').addEventListener('change', syncEndDateFromDuration);
  document.getElementById('m-milestone').addEventListener('change', e => {
    updateMilestoneFields(e.target.checked);
    if (e.target.checked) {
      document.getElementById('m-end').value = document.getElementById('m-start').value;
      document.getElementById('m-duration').value = 0;
    }
  });
  document.getElementById('m-progress').addEventListener('input', e => {
    document.getElementById('m-progress-val').textContent = e.target.value + '%';
  });
  // Close on overlay click
  document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-overlay')) closeModal();
  });
}

function syncDurationFromDates() {
  const s = document.getElementById('m-start').value;
  const e = document.getElementById('m-end').value;
  if (s && e) {
    const days = diffDays(parseDate(s), parseDate(e));
    document.getElementById('m-duration').value = Math.max(0, days);
  }
}

function syncEndDateFromDuration() {
  const s = document.getElementById('m-start').value;
  const dur = parseInt(document.getElementById('m-duration').value) || 0;
  if (s) {
    document.getElementById('m-end').value = fmtDate(addDays(parseDate(s), dur));
  }
}

// ═══════════════════════════════════════════════════════════
// NEW TASK
// ═══════════════════════════════════════════════════════════
function newTask() {
  ensureProject();
  openModal(null);
}

// ═══════════════════════════════════════════════════════════
// PROJECT NAME EDIT
// ═══════════════════════════════════════════════════════════
function setupProjectNameEdit() {
  const el = document.getElementById('project-name');
  el.addEventListener('click', () => {
    if (!state.project) return;
    el.contentEditable = 'true';
    el.focus();
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(range);
  });
  el.addEventListener('blur', () => {
    el.contentEditable = 'false';
    if (state.project) state.project.project_name = el.textContent.trim() || 'Sin nombre';
  });
  el.addEventListener('keydown', e => {
    if (e.key==='Enter') { e.preventDefault(); el.blur(); }
    if (e.key==='Escape') {
      el.contentEditable='false';
      if (state.project) el.textContent = state.project.project_name;
    }
  });
}

// ═══════════════════════════════════════════════════════════
// KEYBOARD SHORTCUTS
// ═══════════════════════════════════════════════════════════
function setupKeyboard() {
  document.addEventListener('keydown', e => {
    // Escape: close modal
    if (e.key==='Escape') {
      if (!document.getElementById('modal-overlay').hidden) {
        closeModal(); e.preventDefault(); return;
      }
    }
    // Enter on modal: save
    if (e.key==='Enter' && e.ctrlKey) {
      if (!document.getElementById('modal-overlay').hidden) {
        saveModal(); e.preventDefault(); return;
      }
    }
    // Delete/Backspace: delete selected task (only when not typing in input)
    if ((e.key==='Delete'||e.key==='Backspace') && document.getElementById('modal-overlay').hidden) {
      const tag = document.activeElement.tagName;
      if (tag==='INPUT'||tag==='TEXTAREA'||document.activeElement.contentEditable==='true') return;
      if (state.selectedId) {
        const task = getTaskById(state.selectedId);
        if (task) openModal(state.selectedId);
        e.preventDefault();
      }
    }
  });
}

// ═══════════════════════════════════════════════════════════
// FILE I/O
// ═══════════════════════════════════════════════════════════
function openFile() { document.getElementById('file-input').click(); }

function handleFileOpen(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    try {
      const data = JSON.parse(evt.target.result);
      loadProject(data, file.name);
    } catch(err) { alert('Error al leer el archivo: ' + err.message); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

async function saveFile() {
  if (!state.project) { alert('No hay proyecto cargado.'); return; }
  const json = JSON.stringify(state.project, null, 2);
  const filename = (state.project.project_name || 'proyecto')
    .replace(/[^a-z0-9áéíóúüñ _-]/gi,'_') + '.json';
  try {
    const downloads = await claude.use('downloads');
    if (!downloads) { alert('Descarga no disponible en este entorno.'); return; }
    await downloads.save({ filename, data: json });
  } catch (err) {
    if (err?.code==='declined') return;
    console.error('Save error', err);
    alert('No se pudo guardar: ' + (err?.message || err));
  }
}

function loadProject(data, filename) {
  state.project = data;
  document.getElementById('project-name').textContent =
    data.project_name || filename || 'Proyecto sin nombre';
  state.expanded.clear();
  (data.tasks||[]).forEach(t => { if (!t.parentId) state.expanded.add(t.id); });
  document.getElementById('empty-state').style.display = 'none';
  rebuildAndRender(true);
}

// ═══════════════════════════════════════════════════════════
// VIEW / ZOOM
// ═══════════════════════════════════════════════════════════
function setView(v) {
  state.view=v; state.pxPerDay=VIEW_PX[v];
  document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.v===v));
  rebuildAndRender();
}
function zoom(dir) {
  state.pxPerDay = Math.max(1, Math.min(80, state.pxPerDay + dir*4));
  rebuildAndRender();
}
function scrollToToday() {
  const ganttWrap = document.getElementById('gantt-wrap');
  const tx = dateToX(new Date());
  const visW = ganttWrap.clientWidth;
  ganttWrap.scrollLeft = Math.max(0, tx - visW/3);
}

// ═══════════════════════════════════════════════════════════
// MAIN RENDER CYCLE
// ═══════════════════════════════════════════════════════════
function rebuildAndRender(scrollTodayOnLoad) {
  calcRange();
  state.flat = buildFlat();
  renderLeft();
  renderRuler();
  renderGantt();
  if (scrollTodayOnLoad) requestAnimationFrame(scrollToToday);
}

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { renderRuler(); renderGantt(); }, 100);
});

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
setupScrollSync();
setupCanvasInteraction();
setupRowEvents();
setupResize();
setupModal();
setupProjectNameEdit();
setupKeyboard();
initColorSwatches();
loadProject(DEMO, 'demo.cronogrami');
</script>
